<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        // Kept in sync with COLOR_MODE_KEY in src/contexts/ColorModeContext.jsx
        // -- must read the exact same key/default so this pre-hydration paint
        // never flashes a different mode than React settles on after mount.
        var mode;
        try { mode = localStorage.getItem('sstli-color-mode-v2'); } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode = 'dark';
        }
        document.documentElement.dataset.colorMode = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

    <title>ERP SYSTEM</title>
  </head>
<body dir="rtl">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
</html>
